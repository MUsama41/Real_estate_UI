  <script>

    (() => {

      const section = document.getElementById('ABS-ProjectsGrid-template--27992322015553__projects_grid');

      if (!section || section.dataset.gridInitialized === 'true') return;



      section.dataset.gridInitialized = 'true';



      const filterButtons = Array.from(

        section.querySelectorAll('[data-project-filter]')

      );



      const cards = Array.from(

        section.querySelectorAll('[data-project-card]')

      );



      const setFilter = (filter) => {

        filterButtons.forEach((button) => {

          const active = button.dataset.projectFilter === filter;

          button.classList.toggle('is-active', active);

          button.setAttribute('aria-pressed', active ? 'true' : 'false');

        });



        cards.forEach((card) => {

          const category = card.dataset.projectCategory;

          const show = filter === 'all' || category === filter;

          card.classList.toggle('is-hidden', !show);

        });

      };



      filterButtons.forEach((button) => {

        button.addEventListener('click', () => {

          setFilter(button.dataset.projectFilter);

        });

      });



      if (window.matchMedia('(pointer: fine)').matches) {

        cards.forEach((card) => {

          const glass = card.querySelector('[data-abs-card-glass]');

          if (!glass) return;



          card.addEventListener('pointermove', (event) => {

            const rect = glass.getBoundingClientRect();

            const x = event.clientX - rect.left;

            const y = event.clientY - rect.top;

            glass.style.setProperty('--mouse-x', `${x}px`);

            glass.style.setProperty('--mouse-y', `${y}px`);

          });

        });

      }

    })();

  </script>
